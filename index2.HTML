<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="default">

<meta name="apple-mobile-web-app-title"
      content="10万円チャレンジ">

<title>10万円チャレンジ｜Monthly Diary</title>


<style>

/* =========================
   BASIC
========================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    background: #f6f6f4;
}

body {

    margin: 0;

    background: #f6f6f4;

    color: #333;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

    -webkit-font-smoothing: antialiased;
}


button,
input {

    font-family: inherit;

}


/* =========================
   APP
========================= */

.app {

    width: 100%;

    max-width: 520px;

    margin: 0 auto;

    padding:
        18px
        14px
        40px;

}


/* =========================
   HEADER
========================= */

.header {

    background: #fff;

    border-radius: 22px;

    padding:
        22px
        20px
        20px;

    margin-bottom: 14px;

    box-shadow:
        0 2px 12px
        rgba(0,0,0,.04);

}


.title {

    font-size: 20px;

    font-weight: 700;

    letter-spacing: .04em;

    margin-bottom: 5px;

}


.period {

    color: #888;

    font-size: 12px;

}


/* =========================
   SYNC STATUS
========================= */

.sync-status {

    margin-top: 10px;

    font-size: 10px;

    color: #999;

    text-align: right;

}

.sync-status.success {

    color: #7b958f;

}

.sync-status.error {

    color: #b87878;

}


/* =========================
   DASHBOARD
========================= */

.dashboard {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 9px;

    margin-top: 18px;

}


.card {

    background: #fafafa;

    border-radius: 16px;

    padding:
        13px
        12px;

}


.card-label {

    font-size: 11px;

    color: #999;

    margin-bottom: 5px;

}


.card-value {

    font-size: 18px;

    font-weight: 700;

}


.progress-card {

    grid-column: 1 / -1;

}


.progress-bar {

    width: 100%;

    height: 9px;

    background: #e8e8e5;

    border-radius: 20px;

    overflow: hidden;

    margin-top: 8px;

}


.progress-fill {

    height: 100%;

    width: 0%;

    background: #777;

    border-radius: 20px;

    transition:
        width .25s ease;

}


/* =========================
   MONTH NAVIGATION
========================= */

.section-title {

    font-size: 15px;

    font-weight: 700;

    margin:
        22px
        3px
        10px;

}


.month-tabs {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 6px;

    margin-bottom: 14px;

}


.month-tab {

    border: 0;

    background: #e9e9e6;

    color: #888;

    border-radius: 12px;

    padding: 9px 0;

    font-size: 12px;

    font-weight: 600;

}


.month-tab.active {

    background: #333;

    color: #fff;

}


/* =========================
   MONTHLY DIARY
========================= */

.diary {

    background: #fff;

    border-radius: 22px;

    padding:
        19px
        13px
        17px;

    box-shadow:
        0 2px 12px
        rgba(0,0,0,.04);

}


.month-heading {

    text-align: center;

    margin-bottom: 17px;

}


.month-number {

    font-size: 11px;

    color: #aaa;

    letter-spacing: .14em;

}


.month-name {

    font-size: 22px;

    font-weight: 700;

    letter-spacing: .04em;

    margin-top: 2px;

}


.weekdays,
.calendar {

    display: grid;

    grid-template-columns:
        repeat(7, 1fr);

    gap: 5px;

}


.weekdays {

    margin-bottom: 6px;

}


.weekday {

    text-align: center;

    color: #999;

    font-size: 9px;

    padding-bottom: 4px;

}


.day {

    min-width: 0;

    min-height: 62px;

    border:
        1px solid #ededeb;

    border-radius: 10px;

    padding:
        5px
        4px;

    background: #fff;

    position: relative;

}


.day.empty {

    border: 0;

    background: transparent;

}


.date-number {

    font-size: 10px;

    color: #777;

    line-height: 1;

}


.job-input {

    width: 100%;

    border: 0;

    outline: none;

    background: #f7f7f5;

    border-radius: 7px;

    text-align: center;

    font-size: 13px;

    font-weight: 600;

    color: #333;

    padding:
        8px
        1px;

    margin-top: 7px;

}


.job-input:focus {

    background: #ededeb;

}


.job-input:disabled {

    background: #f2f2f0;

    color: #aaa;

}


.day.disabled {

    opacity: .3;

}


.day.today {

    border:
        1.5px solid #777;

}


/* =========================
   SAVING STATE
========================= */

.day.saving {

    border-color: #b9c7c4;

}


.day.saved {

    border-color: #d7e2df;

}


/* =========================
   MONTH SUMMARY
========================= */

.month-summary {

    margin-top: 15px;

    background: #f7f7f5;

    border-radius: 14px;

    padding:
        13px
        14px;

}


.summary-title {

    font-size: 10px;

    color: #999;

    margin-bottom: 6px;

    letter-spacing: .08em;

}


.summary-row {

    display: flex;

    justify-content: space-between;

    align-items: center;

    font-size: 13px;

    padding: 3px 0;

}


.summary-row strong {

    font-size: 15px;

}


/* =========================
   TOTAL SECTION
========================= */

.total-section {

    margin-top: 15px;

    background: #333;

    color: white;

    border-radius: 20px;

    padding: 19px;

}


.total-title {

    font-size: 11px;

    opacity: .6;

    letter-spacing: .1em;

    margin-bottom: 9px;

}


.total-money {

    font-size: 29px;

    font-weight: 700;

}


.total-sub {

    margin-top: 5px;

    font-size: 11px;

    opacity: .65;

}


/* =========================
   FOOTER
========================= */

.note {

    text-align: center;

    color: #aaa;

    font-size: 10px;

    margin-top: 17px;

    line-height: 1.7;

}


/* =========================
   LOADING
========================= */

.loading {

    text-align: center;

    color: #999;

    font-size: 11px;

    padding: 30px 0;

}


/* =========================
   RESPONSIVE
========================= */

@media (max-width: 360px) {

    .app {

        padding-left: 9px;

        padding-right: 9px;

    }


    .day {

        min-height: 58px;

    }


    .job-input {

        font-size: 12px;

        padding:
            7px
            1px;

    }

}

</style>

</head>


<body>


<div class="app">


    <!-- =====================
         HEADER
    ====================== -->

        <!-- DASHBOARD -->

        <div class="dashboard">

                <div

                    <div

                        id="progressFill">

    <!-- =====================

    <div class="section-title">

            <div

        <!-- WEEKDAYS -->

    <!-- =====================

<script>

/* ==================================================
   基本設定
================================================== */


/*
   ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★
   ここだけ必ず変更してください
   ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★
*/

const API_URL =
    "https://script.google.com/macros/s/AKfycbxQI_hqRVIzbk4FL26A7YtlIrsN92QCloEwrnSJnlHptsk9Yt-AAd3yvnXxpQAx3keb/exec";


/* ==================================================
   チャレンジ設定
================================================== */

const GOAL =
    100000;


const UNIT_PRICE =
    600;


const YEAR =
    2026;


const START_DATE =
    new Date(
        YEAR,
        8,
        4
    );


const END_DATE =
    new Date(
        YEAR,
        11,
        31
    );


const monthNames = {

    9:
        "SEPTEMBER",

    10:
        "OCTOBER",

    11:
        "NOVEMBER",

    12:
        "DECEMBER"

};


let currentMonth =
    9;


/*
   Apps Scriptから取得した
   最新データをここに保持します。
*/

let appData = {};


/* ==================================================
   日付キー
================================================== */

function dateKey(
    year,
    month,
    day
) {

    return (

        `${year}-` +

        `${String(month)
            .padStart(2, "0")}-` +

        `${String(day)
            .padStart(2, "0")}`

    );

}


/* ==================================================
   日付がチャレンジ期間内か
================================================== */

function isAvailableDate(
    date
) {

    return (

        date >= START_DATE &&
        date <= END_DATE

    );

}


/* ==================================================
   円表示
================================================== */

function yen(
    number
) {

    return (

        "¥" +

        Number(number)
            .toLocaleString(
                "ja-JP"
            )

    );

}


/* ==================================================
   Apps Scriptからデータ取得
   JSONPを使用
================================================== */

function loadData() {

    return new Promise(
        function(resolve, reject) {


            /*
               callback名を毎回変える
            */

            const callbackName =

                "savingCallback_" +
                Date.now();


            /*
               JSONP callback
            */

            window[callbackName] =

                function(result) {


                    /*
                       callback削除
                    */

                    delete window[
                        callbackName
                    ];


                    /*
                       script削除
                    */

                    if (script) {

                        script.remove();

                    }


                    /*
                       結果確認
                    */

                    if (
                        result &&
                        result.success
                    ) {

                        resolve(
                            result.data || {}
                        );

                    } else {

                        reject(
                            new Error(
                                "データ取得に失敗しました"
                            )
                        );

                    }

                };


            /*
               scriptタグ作成
            */

            const script =
                document.createElement(
                    "script"
                );


            /*
               Apps Script URL
            */

            script.src =

                API_URL +

                "?action=get" +

                "&callback=" +

                callbackName;


            /*
               エラー処理
            */

            script.onerror =

                function() {

                    delete window[
                        callbackName
                    ];

                    script.remove();

                    reject(
                        new Error(
                            "サーバーに接続できませんでした"
                        )
                    );

                };


            /*
               HTMLへ追加
            */

            document.body.appendChild(
                script
            );

        }
    );

}


/* ==================================================
   Apps Scriptへ保存
   JSONPを使用
================================================== */

function saveToServer(
    date,
    jobs
) {

    return new Promise(
        function(resolve, reject) {


            const callbackName =

                "saveCallback_" +
                Date.now();


            window[callbackName] =

                function(result) {


                    delete window[
                        callbackName
                    ];


                    if (script) {

                        script.remove();

                    }


                    if (
                        result &&
                        result.success
                    ) {

                        resolve(
                            result.data || {}
                        );

                    } else {

                        reject(
                            new Error(
                                "保存に失敗しました"
                            )
                        );

                    }

                };


            const script =
                document.createElement(
                    "script"
                );


            script.src =

                API_URL +

                "?action=save" +

                "&date=" +

                encodeURIComponent(
                    date
                ) +

                "&jobs=" +

                encodeURIComponent(
                    jobs
                ) +

                "&callback=" +

                callbackName;


            script.onerror =

                function() {

                    delete window[
                        callbackName
                    ];

                    script.remove();

                    reject(
                        new Error(
                            "保存サーバーに接続できませんでした"
                        )
                    );

                };


            document.body.appendChild(
                script
            );

        }
    );

}


/* ==================================================
   同期ステータス
================================================== */

function setSyncStatus(
    text,
    type
) {

    const element =
        document.getElementById(
            "syncStatus"
        );


    element.textContent =
        text;


    element.className =
        "sync-status";


    if (type) {

        element.classList.add(
            type
        );

    }

}


/* ==================================================
   月切り替え
================================================== */

function showMonth(
    month
) {

    currentMonth =
        month;


    document
        .querySelectorAll(
            ".month-tab"
        )
        .forEach(

            function(
                button,
                index
            ) {

                button.classList.toggle(

                    "active",

                    index ===
                    month - 9

                );

            }

        );


    document.getElementById(
        "monthName"
    ).textContent =
        monthNames[month];


    renderCalendar();

    updateDashboard();

}


/* ==================================================
   カレンダー生成
================================================== */

function renderCalendar() {


    const calendar =
        document.getElementById(
            "calendar"
        );


    calendar.innerHTML = "";


    const firstDay =

        new Date(
            YEAR,
            currentMonth - 1,
            1
        ).getDay();


    const daysInMonth =

        new Date(
            YEAR,
            currentMonth,
            0
        ).getDate();


    /*
       月初の空白
    */

    for (
        let i = 0;
        i < firstDay;
        i++
    ) {

        const empty =
            document.createElement(
                "div"
            );


        empty.className =
            "day empty";


        calendar.appendChild(
            empty
        );

    }


    /*
       日付
    */

    for (
        let day = 1;
        day <= daysInMonth;
        day++
    ) {


        const cell =
            document.createElement(
                "div"
            );


        cell.className =
            "day";


        const currentDate =

            new Date(
                YEAR,
                currentMonth - 1,
                day
            );


        /*
           期間外
        */

        const available =
            isAvailableDate(
                currentDate
            );


        if (!available) {

            cell.classList.add(
                "disabled"
            );

        }


        /*
           今日
        */

        const today =
            new Date();


        if (

            currentDate
                .getFullYear() ===
            today.getFullYear()

            &&

            currentDate
                .getMonth() ===
            today.getMonth()

            &&

            currentDate
                .getDate() ===
            today.getDate()

        ) {

            cell.classList.add(
                "today"
            );

        }


        /*
           日付
        */

        const dateLabel =
            document.createElement(
                "div"
            );


        dateLabel.className =
            "date-number";


        dateLabel.textContent =
            day;


        /*
           入力欄
        */

        const input =
            document.createElement(
                "input"
            );


        input.className =
            "job-input";


        input.type =
            "number";


        input.inputMode =
            "numeric";


        input.min =
            "0";


        input.max =
            "99";


        input.placeholder =
            "件";


        /*
           日付キー
        */

        const key =

            dateKey(
                YEAR,
                currentMonth,
                day
            );


        /*
           保存済みデータ
        */

        if (
            appData[key] !== undefined
        ) {

            input.value =
                appData[key];

        }


        /*
           期間外は入力不可
        */

        if (!available) {

            input.disabled =
                true;

        }


        /*
           入力イベント
        */

        input.addEventListener(

            "input",

            async function() {


                let value =

                    parseInt(
                        input.value,
                        10
                    );


                /*
                   数字以外
                */

                if (
                    isNaN(value) ||
                    value < 0
                ) {

                    value = 0;

                }


                /*
                   最大99件
                */

                if (
                    value > 99
                ) {

                    value = 99;

                }


                /*
                   表示
                */

                input.value =

                    value === 0
                        ? ""
                        : value;


                /*
                   ローカルデータ更新
                */

                if (
                    value === 0
                ) {

                    delete appData[key];

                } else {

                    appData[key] =
                        value;

                }


                /*
                   まず画面を即時更新
                */

                updateDashboard();


                /*
                   保存中表示
                */

                cell.classList.remove(
                    "saved"
                );

                cell.classList.add(
                    "saving"
                );


                setSyncStatus(
                    "保存中…"
                );


                try {


                    /*
                       Apps Scriptへ保存
                    */

                    const latestData =
                        await saveToServer(
                            key,
                            value
                        );


                    /*
                       サーバー側の
                       最新データを反映
                    */

                    appData =
                        latestData;


                    /*
                       保存成功
                    */

                    cell.classList.remove(
                        "saving"
                    );

                    cell.classList.add(
                        "saved"
                    );


                    setSyncStatus(
                        "保存しました",
                        "success"
                    );


                    /*
                       少し時間を置いて
                       通常表示に戻す
                    */

                    setTimeout(

                        function() {

                            cell.classList.remove(
                                "saved"
                            );

                        },

                        1200

                    );


                } catch (error) {


                    /*
                       保存失敗
                    */

                    cell.classList.remove(
                        "saving"
                    );


                    setSyncStatus(
                        "保存に失敗しました",
                        "error"
                    );


                    console.error(
                        error
                    );

                }


            }

        );


        cell.appendChild(
            dateLabel
        );


        cell.appendChild(
            input
        );


        calendar.appendChild(
            cell
        );

    }

}


/* ==================================================
   全体集計
================================================== */

function calculateTotals() {


    let totalJobs =
        0;


    Object.values(
        appData
    ).forEach(

        function(value) {

            totalJobs +=
                Number(value) || 0;

        }

    );


    const totalMoney =
        totalJobs *
        UNIT_PRICE;


    const remaining =
        Math.max(
            0,
            GOAL -
            totalMoney
        );


    const percent =
        Math.min(
            100,
            (
                totalMoney /
                GOAL
            ) * 100
        );


    return {

        totalJobs,

        totalMoney,

        remaining,

        percent

    };

}


/* ==================================================
   月間集計
================================================== */

function calculateMonth(
    month
) {


    let jobs =
        0;


    const days =

        new Date(
            YEAR,
            month,
            0
        ).getDate();


    for (
        let day = 1;
        day <= days;
        day++
    ) {


        const key =

            dateKey(
                YEAR,
                month,
                day
            );


        jobs +=

            Number(
                appData[key]
            ) || 0;

    }


    return {

        jobs,

        money:
            jobs *
            UNIT_PRICE

    };

}


/* ==================================================
   ダッシュボード更新
================================================== */

function updateDashboard() {


    const totals =
        calculateTotals();


    /*
       貯まった金額
    */

    document.getElementById(
        "totalMoney"
    ).textContent =

        yen(
            totals.totalMoney
        );


    /*
       残り
    */

    document.getElementById(
        "remainingMoney"
    ).textContent =

        yen(
            totals.remaining
        );


    /*
       累計件数
    */

    document.getElementById(
        "totalJobs"
    ).textContent =

        `${totals.totalJobs}件`;


    /*
       達成率
    */

    document.getElementById(
        "progressPercent"
    ).textContent =

        `${totals.percent.toFixed(1)}%`;


    /*
       プログレスバー
    */

    document.getElementById(
        "progressFill"
    ).style.width =

        `${totals.percent}%`;


    /*
       TOTAL
    */

    document.getElementById(
        "totalMoneyBottom"
    ).textContent =

        yen(
            totals.totalMoney
        );


    document.getElementById(
        "totalSub"
    ).textContent =

        `目標 ${yen(GOAL)}`;


    /*
       月間
    */

    const month =
        calculateMonth(
            currentMonth
        );


    document.getElementById(
        "monthJobs"
    ).textContent =

        `${month.jobs}件`;


    document.getElementById(
        "monthMoney"
    ).textContent =

        yen(
            month.money
        );

}


/* ==================================================
   初期化
================================================== */

async function initialize() {


    setSyncStatus(
        "データを読み込み中…"
    );


    try {


        /*
           Apps Scriptから
           最新データ取得
        */

        appData =
            await loadData();


        /*
           カレンダー表示
        */

        renderCalendar();


        /*
           集計
        */

        updateDashboard();


        /*
           同期成功
        */

        setSyncStatus(
            "同期済み",
            "success"
        );


    } catch (error) {


        console.error(
            error
        );


        /*
           データ取得失敗時
        */

        appData =
            {};


        renderCalendar();

        updateDashboard();


        setSyncStatus(
            "データ取得に失敗しました",
            "error"
        );

    }

}


/*
   起動
*/

initialize();

</script>
